services:
  gradlemcp:
    build: .
    restart: unless-stopped
    ports:
      - "${GRADLEMCP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - .gradlemcp.env
    volumes:
      - ./data:/var/lib/gradlemcp/data
      - ./gradlemcp.json:/var/lib/gradlemcp/gradlemcp.json:ro
      # Trusted controller only. Root-equivalent; never pass this to build containers.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    environment:
      GRADLEMCP_DOMAIN: ${GRADLEMCP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gradlemcp:
        condition: service_healthy
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: [cloudflare]
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    restart: unless-stopped
  ngrok:
    image: ngrok/ngrok:3
    profiles: [ngrok]
    command: start --all --config /etc/ngrok.yml
    volumes: ["./deploy/ngrok.local.yml:/etc/ngrok.yml:ro"]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
secrets:
  tunnel_token:
    file: ./deploy/cloudflare-token.local
